# Authoritative lint and format settings; test_toolchain_config.py keeps them aligned with
# pyproject.toml (Python 3.14) and .editorconfig (two-space indentation).

# Ruff also formats Python code blocks in Markdown. Historical traceability records keep the
# snippets they were written with.
extend-exclude = ["traceability-log"]
indent-width = 2
line-length = 100
target-version = "py314"

[lint]
ignore = ["F403", "F401"]
select = ["E", "F", "I", "B", "S"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"packages/*/tests/**/*.py" = ["S101", "S105", "S106"]
"tests/**/*.py" = ["S101", "S105", "S106"]
