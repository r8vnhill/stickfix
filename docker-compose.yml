# The bot and the one-shot migration job share the same connection string; it is
# defined once here and merged into both services' `environment` via a YAML anchor.
x-database-env: &database-env
  STICKFIX_DATABASE_URL: >-
    postgresql+psycopg://${POSTGRES_USER:-stickfix}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-stickfix}

services:
  db:
    image: postgres:18.6-bookworm
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stickfix}
      POSTGRES_USER: ${POSTGRES_USER:-stickfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql

  # Applies Alembic migrations, then exits; `bot` waits for it to succeed.
  migrate:
    build: .
    environment:
      <<: *database-env
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]

  bot:
    build: .
    environment:
      <<: *database-env
      STICKFIX_TOKEN: ${STICKFIX_TOKEN:?STICKFIX_TOKEN must be set}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
