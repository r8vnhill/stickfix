[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=66", "wheel>=0.40"]

[project]
dependencies = [
  "stickfix-domain",
  "stickfix-application",
  "python-telegram-bot>=13.15,<14",
  "PyYAML>=6.0,<7",
  # PTB 13 compatibility constraints; see tests/architecture/dependency_policy.py.
  "urllib3>=1.26,<1.27",  # PTB 13's upstream-urllib3 fallback (needs contrib.appengine).
  "six>=1.17,<1.18",  # Retained legacy bound; also required by PTB 13's APScheduler.
  "SQLAlchemy>=2.0.52,<3",
  "alembic>=1.19.1,<2",
  "psycopg[binary]>=3.2,<4",
]
description = "Telegram sticker tagging assistant that keeps sticker metadata searchable."
name = "stickfix-bot"
readme = "README.md"
requires-python = ">=3.14,<4"
version = "0.1.0"
[project.optional-dependencies]
db = [
  "pgvector>=0.4.1,<0.5",
]
graph = [
  "neo4j>=6.0,<7.0",
]

[dependency-groups]
dev = [
  "pytest>=7.0,<8.0",
  "pytest-cov>=4.0,<5.0",
  "pytest-bdd>=7.0,<8.0",
  "pre-commit>=3.0,<4.0",
  "hypothesis>=6.0,<7.0",
  "pyhamcrest>=2.1,<3.0",
  "ruff>=0.4,<1.0",
]

[project.urls]
Homepage = "https://github.com/r8vnhill/stickfix"
Repository = "https://github.com/r8vnhill/stickfix"

[tool.setuptools]
py-modules = ["imghdr"]

[tool.setuptools.packages.find]
# bot.handlers intentionally uses implicit namespace discovery (no __init__.py).
include = ["bot", "bot.*"]
namespaces = true

[tool.pytest.ini_options]
markers = [
  "integration: tests requiring an explicitly configured external service",
]
norecursedirs = [
  ".git",
  ".hypothesis",
  ".pytest-tmp",
  ".pytest_cache",
  ".venv",
  "data",
  "logs",
  "venv",
  "worktmp",
]

[tool.uv]
# PTB 13.15 pins tornado==6.1, but Stickfix starts via polling only and does
# not expose PTB's Tornado webhook server path affected by CVE-2026-31958.
# Remove this bounded override during a future PTB migration.
override-dependencies = ["tornado>=6.5.5,<7"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
stickfix-application = {workspace = true}
stickfix-domain = {workspace = true}
