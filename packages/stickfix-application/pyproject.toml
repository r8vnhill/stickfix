[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=66", "wheel>=0.40"]

[project]
dependencies = [
  "expression>=5.8,<6",
  "stickfix-domain",
]
description = "Stickfix's Telegram- and persistence-free application layer."
name = "stickfix-application"
readme = "README.md"
requires-python = ">=3.14,<4"
version = "0.1.0"

[tool.uv.sources]
stickfix-domain = {workspace = true}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
